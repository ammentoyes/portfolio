<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>About Me</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		body {
			background-color: #f8f8f8;
			font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
			color: #333;
			padding-top: 150px;
		}

		.profile-img {
			width: 280px;
			height: 280px;
			object-fit: cover;
			border-radius: 50%;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
			border: 5px solid white;
		}

		.about-text h1 {
			font-weight: 300;
			letter-spacing: 2px;
			margin-bottom: 25px;
		}

		.about-text p {
			line-height: 2.5;
			color: #666;
			margin-bottom: 20px;
			font-size: 1.2rem;
		}

		.fixed-back-btn {
			position: fixed;
			top: 20px;
			left: 20px;
			z-index: 2000;
			background-color: rgba(255, 255, 255, 0.7);
			backdrop-filter: blur(4px);
			transition: all 0.3s ease;
		}

		.fixed-back-btn:hover {
			background-color: #000;
			color: #fff;
		}

		@media (max-width: 768px) {
			.profile-img {
				width: 200px;
				height: 200px;
				margin-bottom: 30px;
			}

			.about-text {
				text-align: center;
			}

			.fixed-back-btn {
				left: 20px !important;
				top: 15px !important;
			}
		}
	</style>
</head>

<body>


	<a href="index.html#title" class="btn btn-outline-dark fixed-back-btn">
		← Home
	</a>

	<div class="container py-5">
		<div class="row align-items-center justify-content-center">

			<div class="col-md-5 text-center mb-4 mb-md-0">
				<img src="profile.jpg" alt="Mento Studio" class="profile-img img-fluid">
			</div>

			<div class="col-md-7 about-text ps-md-5">
				<p>Hello, I'm Zoey.</p>
				<p>
					Based in Taipei, Taiwan.
				</p>
				<p>
					Still learning photography, hoping there's one day I can move people by my works.
				</p>

				<a href="#portfolio" class="btn btn-dark mt-2">View My Work</a>
			</div>

		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

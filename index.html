<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            /*scroll-snap-type: y proximity;*/
            /*scroll-behavior: smooth;*/
            /*overflow-y: scroll;*/
            overflow-x: hidden;
        }

        .logo {

            a:link,
            a:visited {
                background-color: white;
                color: black;
                border: 0;
                padding: 10px 20px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
            }

            a:hover,
            a:active {
                background-color: rgb(168, 168, 168);
                color: white;
            }
        }

        .section {
            min-height: 100vh;
            width: 100%;
            /*scroll-snap-align: start;*/
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .title {
            height: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            border-bottom: 1px solid black;
            background: white;
            z-index: 1000;
        }

        .menu {

            a:link,
            a:visited {
                background-color: white;
                color: black;
                border: 0;
                padding: 10px 20px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
            }

            a:hover,
            a:active {
                background-color: rgb(168, 168, 168);
                color: white;
            }
        }

        .recent_works {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .carousel {
            width: 100%;
            max-width: 700px;
        }

        .scroll-down {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-decoration: none;
        }

        .arrow {
            width: 20px;
            height: 20px;
            border-right: 2px solid black;
            border-bottom: 2px solid black;
            transform: rotate(45deg);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0) rotate(45deg);
            }

            40% {
                transform: translateY(-10px) rotate(45deg);
            }

            60% {
                transform: translateY(-5px) rotate(45deg);
            }
        }

        .portfolio-section {
            background-color: #f8f8f8;
            padding: 100px 40px;
        }

        .card {
            overflow: hidden;
        }

        .card-img-top {
            transition: transform 0.5s ease;
            cursor: pointer;
        }

        .card:hover .card-img-top {
            transform: scale(1.1);
        }

        .card-img-top {
            transition: transform 0.5s ease;
        }

        .card:hover .card-img-top {
            transform: scale(1.1);
        }

        .portfolio-section {
            background-color: #f8f8f8;
            padding: 100px 40px;
        }
    </style>
</head>

<body>
    <div class="section">
        <div class="title">
            <div class="logo">
                <a href="https://www.instagram.com/mento_archive/" target="_blank">Mento Studio</a>
            </div>
            <div class="menu">
                <a href="about.html">About</a>
                <a href="#portfolio">Gallery</a>
                <a href="#" data-bs-toggle="modal" data-bs-target="#contactModal">Contact</a>
            </div>
        </div>
        <div class="recent_works">
            <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3500">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0"
                        class="active"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="3"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="4"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="5"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="6"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="7"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="8"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="9"></button>
                    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="10"></button>
                </div>
                <div class="carousel-inner">
                    <div class="carousel-item active"><img src="recentWork/work1.jpg" class="d-block w-100"></div>
                    <div class="carousel-item"><img src="recentWork/work4.jpg" class="d-block w-100"></div>
                    <div class="carousel-item"><img src="recentWork/work6.jpg" class="d-block w-100"></div>
                    <div class="carousel-item"><img src="recentWork/work29.jpg" class="d-block w-100"></div>
                    <div class="carousel-item"><img src="recentWork/work67.jpg" class="d-block w-100"></div>
                    <div class="carousel-item"><img src="recentWork/work76.jpg" class="d-block w-100"></div>
                    <div class="carousel-item"><img src="recentWork/work115.jpg" class="d-block w-100"></div>
                    <div class="carousel-item"><img src="recentWork/work134.jpg" class="d-block w-100"></div>
                    <div class="carousel-item"><img src="recentWork/work174.jpg" class="d-block w-100"></div>
                    <div class="carousel-item"><img src="recentWork/work319.jpg" class="d-block w-100"></div>
                    <div class="carousel-item"><img src="recentWork/work330.jpg" class="d-block w-100"></div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
        <a href="#portfolio" class="scroll-down">
            <div class="arrow"></div>
        </a>
    </div>
    <div id="portfolio" class="section portfolio-section">
        <div class="container">
            <h2 class="text-center mb-5">Gallery</h2>
            <div id="portfolio-grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"></div>
            <div id="photo-wall" class="container" style="display: none;">
                <button onclick="backToGallery()" class="btn btn-secondary mb-4">← back to gallery</button>
                <h2 id="wall-title"></h2>
                <div id="photo-grid-inner" class="row row-cols-2 row-cols-md-3 g-3">
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const portfolioData = [
            { id: "animals", title: "Animals", cover: "images/animals/cover.jpg", description: "animals" },
            { id: "birds", title: "Birds", cover: "images/birds/cover.jpg", description: "YES, BIRDS." },
            { id: "buddies", title: "My Travel Buddies", cover: "images/buddies/cover.jpg", description: "my babes" },
            { id: "human", title: "Human", cover: "images/human/cover.jpg", description: "people on the streets" },
            { id: "people", title: "People", cover: "images/people/cover.jpg", description: "a page for people who I know" },
            { id: "travel", title: "Travel", cover: "images/travel/cover.jpg", description: "every country has its own color" },
            { id: "withStories", title: "Others", cover: "images/withStories/cover.jpg", description: "some pics not yet to be sorted" }
        ];

        const grid = document.getElementById('portfolio-grid');

        portfolioData.forEach(item => {
            grid.innerHTML += `
            <div class="col">
                <div class="card h-100 shadow-sm">
                    <img src="${item.cover}" class="card-img-top" alt="${item.title}">
                    <div class="card-body">
                        <h5 class="card-title">${item.title}</h5>
                        <p class="card-text">${item.description}</p>
                        <a href="detail.html?id=${item.id}" class="btn btn-outline-dark">see more...</a>
                    </div>
                </div>
            </div>
        `;
        });

        function showDetail(id) {
            const category = portfolioData.find(item => item.id === id);

            document.getElementById('portfolio-grid').style.display = 'none';
            document.getElementById('photo-wall').style.display = 'block';

            document.getElementById('wall-title').innerText = category.title;

            const photoGrid = document.getElementById('photo-grid-inner');
            photoGrid.innerHTML = '';
            category.photos.forEach(photo => {
                photoGrid.innerHTML += `
            <div class="col">
                <img src="${photo}" class="img-fluid shadow-sm" style="width:100%; height:200px; object-fit:cover;">
            </div>
        `;
            });
        }

        function backToGallery() {
            document.getElementById('portfolio-grid').style.display = 'flex';
            document.getElementById('photo-wall').style.display = 'none';
        }

        function copyEmail() {
            const email = "mentoarchive05@gmail.com";
            navigator.clipboard.writeText(email).then(() => {
                const status = document.getElementById('copyStatus');
                status.style.display = 'block';

                // 3秒後自動隱藏提示文字
                setTimeout(() => {
                    status.style.display = 'none';
                }, 3000);
            });
        }
    </script>

    <script>
        if ('WebSocket' in window) {
            (function () {
                function refreshCSS() {
                    var sheets = [].slice.call(document.getElementsByTagName("link"));
                    var head = document.getElementsByTagName("head")[0];
                    for (var i = 0; i < sheets.length; ++i) {
                        var elem = sheets[i];
                        var parent = elem.parentElement || head;
                        parent.removeChild(elem);
                        var rel = elem.rel;
                        if (elem.href && typeof rel != "string" || rel.length == 0 || rel.toLowerCase() == "stylesheet") {
                            var url = elem.href.replace(/(&|\?)_cacheOverride=\d+/, '');
                            elem.href = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_cacheOverride=' + (new Date().valueOf());
                        }
                        parent.appendChild(elem);
                    }
                }
                var protocol = window.location.protocol === 'http:' ? 'ws://' : 'wss://';
                var address = protocol + window.location.host + window.location.pathname + '/ws';
                var socket = new WebSocket(address);
                socket.onmessage = function (msg) {
                    if (msg.data == 'reload') window.location.reload();
                    else if (msg.data == 'refreshcss') refreshCSS();
                };
                if (sessionStorage && !sessionStorage.getItem('IsThisFirstTime_Log_From_LiveServer')) {
                    console.log('Live reload enabled.');
                    sessionStorage.setItem('IsThisFirstTime_Log_From_LiveServer', true);
                }
            })();
        }
        else {
            console.error('Upgrade your browser. This Browser is NOT supported WebSocket for Live-Reloading.');
        }
        // ]]>
    </script>
    <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold">Get in Touch</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center py-5">
                    <p class="text-muted mb-4">For bookings, collaborations, or just to say hi, <br> feel free to reach
                        out via email:</p>

                    <div class="d-grid gap-2 col-10 mx-auto">
                        <h4 class="fw-light mb-3">mentoarchive05@gmail.com</h4>

                        <a href="mailto:mentoarchive05@gmail.com?subject=Inquiry from Mento Studio"
                            class="btn btn-dark py-2">
                            Open Mail App
                        </a>

                        <button class="btn btn-outline-secondary py-2" onclick="copyEmail()">
                            Copy Email Address
                        </button>
                    </div>

                    <p id="copyStatus" class="mt-3 text-success fw-bold" style="display: none; font-size: 0.85rem;">
                        Email copied to clipboard!
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
